behavior:
  ros__parameters:
    frequency: 10.0 # {double} [Hz]
    plan_frequency: 2.0 # {double} [Hz]

controller:
  ros__parameters:
    frequency: 20.0 # {double} [Hz]
    lookahead_distance: 0.1 # {double} [m]
    lookahead_lin_vel: 0.2 # {double} [m/s]
    stop_thres: 0.1 # {double} [m]
    max_lin_vel: 0.2 # {double} [m/s]
    max_ang_vel: 2.0 # {double} [rad/s]
    curvature_speed_gain: 0.2 # {double} [m] k in v/(1+k|c|), c in 1/m. 0.0 disables improvement 1.
    rotate_in_place_angle: 1.0 # {double} [rad] 0.0 disables improvement 2.

planner:
  ros__parameters:
    max_access_cost: 90 # {int} []
    algorithm: "astar" # {string} "dijkstra" or "astar"
    smoothing: true # {bool} shortcut and resample the path. Works with either algorithm.
    heuristic_weight: 1.0 # {double} A* only. 1.0 is optimal. Above 1.0 is faster but may be suboptimal.
